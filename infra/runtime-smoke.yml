name: Runner runtime smoke
on:
  workflow_dispatch:
    inputs:
      runner_target:
        type: choice
        options: [auto, github, vps]
        default: vps
        required: true
      allow_fallback:
        type: boolean
        default: false
        required: true
      expect_environment:
        type: choice
        options: [self-hosted, github-hosted]
        default: self-hosted
        required: true
      fail_code:
        type: boolean
        default: false
        required: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ${{ (github.event_name != 'pull_request_target' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (inputs.runner_target == 'vps' || (inputs.runner_target != 'github' && vars.KODIFY_RUNNER_MODE == 'vps')) && (github.run_attempt == 1 || (github.event_name == 'workflow_dispatch' && inputs.allow_fallback == false))) && fromJSON((github.event_name != 'workflow_dispatch' || inputs.allow_fallback != false) && '["self-hosted","Linux","X64","kodify-vps","kodify-fallback-enabled"]' || '["self-hosted","Linux","X64","kodify-vps","kodify-fallback-disabled"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Verify execution destination
        env:
          ACTUAL: ${{ runner.environment }}
          EXPECTED: ${{ inputs.expect_environment }}
        run: test "$ACTUAL" = "$EXPECTED"
      - name: Verify clean disposable state
        if: runner.environment == 'self-hosted'
        run: |
          test ! -e /var/lib/kodifyci/data/work/previous-job-marker
          touch /var/lib/kodifyci/data/work/previous-job-marker
          test -w /opt/hostedtoolcache
          docker info --format '{{json .SecurityOptions}}' | python3 -c 'import sys,json; assert "name=rootless" in json.load(sys.stdin)'
          test -z "$(docker ps -aq --filter name=previous-job-marker)"
          docker create --name previous-job-marker alpine:3.22 true >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify standard tools
        run: |
          node --version
          python --version
          git --version
          az version --query '"azure-cli"' -o tsv
          docker --version
      - name: Verify host filesystem is hidden
        if: runner.environment == 'self-hosted'
        run: |
          docker run --rm --mount type=bind,src=/home,dst=/host-home,readonly alpine:3.22 sh -c 'test -z "$(ls -A /host-home)"'
          for path in /mnt /srv /var/backups; do
            if docker run --rm --mount "type=bind,src=$path,dst=/probe,readonly" alpine:3.22 sh -c 'test -r /probe && test -x /probe'; then
              printf 'Unexpected readable protected host directory\n' >&2
              exit 1
            fi
          done
      - uses: docker/setup-buildx-action@v3
      - name: Verify a real container build
        run: |
          printf 'FROM alpine:3.22\nRUN printf built-ok > /proof\nCMD ["cat", "/proof"]\n' > "$RUNNER_TEMP/Dockerfile"
          docker buildx build --load -t kodify-smoke -f "$RUNNER_TEMP/Dockerfile" "$RUNNER_TEMP"
          test "$(docker run --rm kodify-smoke)" = built-ok
      - name: Ordinary failure must not trigger infrastructure recovery
        if: inputs.fail_code
        run: exit 23
